name: Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The yt-dlp postinstall loads its own dist, which a fresh checkout has not built.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify
        run: bun run verify
