name: Publish
# Tag the release commit `chore(Release): @distube/<plugin>@<version>` with `@distube/<plugin>@<version>`. CI checks
# that commit, builds that package, publishes it with provenance and creates the GitHub release.
on:
  push:
    tags: ["@distube/*@*"]
jobs:
  publish:
    name: Verify, pack and publish
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}
      directory: ${{ steps.tag.outputs.directory }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm: bun publish rejects --provenance (oven-sh/bun#15601)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package from tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^@distube/([a-z-]+)@([0-9A-Za-z.+-]+)$ ]]; then
            echo "Tag must be @distube/<plugin>@<version>: $TAG" >&2
            exit 1
          fi
          directory="packages/${BASH_REMATCH[1]}"
          [[ -f "$directory/package.json" ]] || { echo "No package at $directory" >&2; exit 1; }
          manifest="$(bun -e 'const m = await Bun.file(process.argv[1]).json(); console.log(`${m.name}@${m.version}`)' "$directory/package.json")"
          if [[ "$manifest" != "$TAG" ]]; then
            echo "Tag $TAG does not match $manifest" >&2
            exit 1
          fi
          echo "name=@distube/${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Check the tag is on its release commit
        env:
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.tag.outputs.name }}
          DIRECTORY: ${{ steps.tag.outputs.directory }}
        run: |
          fail() { echo "Tag $TAG is not on its release commit: $1" >&2; exit 1; }
          [[ "$(git log -1 --format=%s)" == "chore(Release): $TAG" ]] || fail "the subject is not 'chore(Release): $TAG'"
          [[ "$(git rev-list --parents -n 1 HEAD | wc -w)" == 2 ]] || fail "it does not have exactly one parent"
          changed="$(git diff --name-only HEAD^ HEAD | sort | paste -sd ' ')"
          [[ "$changed" == "$DIRECTORY/package.json" || "$changed" == "bun.lock $DIRECTORY/package.json" ]] ||
            fail "it changes files other than $DIRECTORY/package.json and bun.lock"
          git show "HEAD^:$DIRECTORY/package.json" > "$RUNNER_TEMP/before.json"
          bun -e '
            const [before, after] = await Promise.all(process.argv.slice(1).map((path) => Bun.file(path).json()));
            const rest = (manifest) => JSON.stringify({ ...manifest, version: undefined });
            process.exit(rest(before) === rest(after) && before.version !== after.version ? 0 : 1);
          ' "$RUNNER_TEMP/before.json" "$DIRECTORY/package.json" || fail "$DIRECTORY/package.json changes more than its version"
          if [[ "$changed" == bun.lock* ]]; then
            git show HEAD^:bun.lock > "$RUNNER_TEMP/bun.lock"
            bun -e '
              const [lock, before, after, directory] = process.argv.slice(1);
              const [from, to] = await Promise.all([before, after].map((path) => Bun.file(path).json()));
              const entry = (version) => `"${directory}": {\n      "name": "${to.name}",\n      "version": "${version}",`;
              const text = await Bun.file(lock).text();
              const expected = text.replace(entry(from.version), entry(to.version));
              process.exit(expected !== text && expected === (await Bun.file("bun.lock").text()) ? 0 : 1);
            ' "$RUNNER_TEMP/bun.lock" "$RUNNER_TEMP/before.json" "$DIRECTORY/package.json" "$DIRECTORY" ||
              fail "bun.lock changes more than the $NAME workspace version"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: bun run check && bun run --filter "$NAME" type && bun run --filter "$NAME" build

      - name: Pack
        working-directory: ${{ steps.tag.outputs.directory }}
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish
        working-directory: ${{ steps.tag.outputs.directory }}
        run: npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release with notes since the package's previous tag
        env:
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.publish.outputs.name }}
          DIRECTORY: ${{ needs.publish.outputs.directory }}
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match "$NAME@*" HEAD^ 2>/dev/null || true)"
          git log --no-merges --format='- %s (%h)' "${previous:+$previous..}HEAD" -- "$DIRECTORY" |
            grep -v '^- chore(Release):' > "$RUNNER_TEMP/notes.md" || true
          args=(--verify-tag --title "$TAG" --latest=false --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
